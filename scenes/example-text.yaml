# The word HELLO in solid block letters, gently nodding forward and back.
# (For words, tilt keeps every letter at the same height; sway turns long
#  words so one end goes far back.)
id: example-text
text3d: "HELLO"
motion: tilt
motion_settings:
  amount: 10      # degrees
  seconds: 8      # one full forward-back cycle
duration: 20
pattern:
  generate: swirl
  palette: ocean
title: "Hidden word"
