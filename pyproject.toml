[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stereogram-engine"
version = "0.1.0"
description = "Turns 3D scenes into animated stereogram videos for Shorts and YouTube"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "pillow>=10.1",
    "pyyaml>=6",
    "pydantic>=2.5",
    "typer>=0.12",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stereo = "engine.cli:app"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
